<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy 21st, Paytyn! 🎂</title>
<meta name="description" content="A little birthday show for Paytyn, live from Cherokee, NC. Volume up!">
<meta property="og:title" content="Happy 21st Birthday, Paytyn! 🎂">
<meta property="og:description" content="Volume up, then tap the chip.">
<meta property="og:image" content="img/raft-paddles.jpg">
<meta name="theme-color" content="#5f98c6">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ CHEROKEE (the world — later the theatre backdrop) ============ -->
<div id="world" aria-hidden="true">
  <canvas id="sky"></canvas>
  <div id="photobg"></div>
  <div class="clouds"><i style="--y:9%;--w:38vmin;--d:120s;--o:-.2"></i><i style="--y:18%;--w:26vmin;--d:95s;--o:-.65"></i><i style="--y:5%;--w:20vmin;--d:140s;--o:-.45"></i><i style="--y:25%;--w:30vmin;--d:110s;--o:-.9"></i></div>
  <div class="batsignal"><svg viewBox="0 0 100 56"><path d="M 50.0 23.0 L 52.6 15.5 L 54.6 8.5 L 56.4 20.5 C 59.5 22.0 63.0 21.5 66.0 19.0 C 72.0 13.0 82.0 9.5 95.0 10.0 C 89.0 14.5 87.5 20.0 90.0 26.5 C 84.5 24.0 78.5 26.0 76.5 32.0 C 72.5 28.5 66.5 30.5 64.5 37.5 C 60.0 34.5 54.5 38.5 50.0 48.0 C 45.5 38.5 40.0 34.5 35.5 37.5 C 33.5 30.5 27.5 28.5 23.5 32.0 C 21.5 26.0 15.5 24.0 10.0 26.5 C 12.5 20.0 11.0 14.5 5.0 10.0 C 18.0 9.5 28.0 13.0 34.0 19.0 C 37.0 21.5 40.5 22.0 43.6 20.5 L 45.4 8.5 L 47.4 15.5 L 50.0 23.0 Z"/></svg></div>
  <canvas id="far"></canvas>
  <div class="mist m1"></div>
  <canvas id="mid"></canvas>
  <canvas id="fx"></canvas>
  <div class="mist m2"></div>
  <canvas id="fore"></canvas>
  <div id="night"><div class="stars"></div></div>
  <canvas id="fx2"></canvas>
</div>

<!-- ============ THEATRE ============ -->
<main id="theatre" aria-label="The Paytyn Show">
  <div id="dim"></div>
  <div class="balloons" aria-hidden="true">
    <i style="--x:8%;--d:13s;--c:#7bafd4"></i><i style="--x:22%;--d:16s;--c:#ffffff"></i>
    <i style="--x:78%;--d:14s;--c:#13294b"></i><i style="--x:90%;--d:17s;--c:#a7cbe6"></i>
    <i style="--x:64%;--d:19s;--c:#f3d27a"></i>
  </div>

  <div class="beam b1"></div><div class="beam b2"></div>

  <div id="screen">
    <div class="screen-fallback"><span>🎂</span><b>Happy Birthday</b><b>Paytyn</b></div>
    <video id="bgvid" muted autoplay playsinline loop preload="auto" poster="media/birthday-poster.jpg"></video>
  </div>
  <div id="hbIntro">
    <h2 class="hbi-big"><span class="hbi-word">Happy</span> <span class="hbi-word">Birthday</span></h2>
    <div class="hbi-name">Paytyn</div>
    <div id="hbiChip" class="chip" style="--c:#13294b;--c2:#7bafd4"><span class="chip-face">21</span></div>
  </div>

  <div id="photos"></div>


  <div id="concert">
    <div class="ticket">
      <div class="t-photo"></div>
      <div class="t-info">
        <small>ADMIT ONE · BIRTHDAY GIRL</small>
        <b>ZAC BROWN BAND</b>
        <span>SEC 225 · ROW ∞ · SEAT 21</span>
      </div>
      <div class="t-stub"><span>NO. 1103</span><svg class="mj" viewBox="0 0 100 100" aria-label="mockingjay pin"><use href="#mockingjay"/></svg></div>
    </div>
    <div class="nowplaying">♪ now playing: <b>Chicken Fried</b> — Zac Brown Band</div>
  </div>

  <div id="finale">
    <div class="hb">
      <div class="hb-1">Happy Birthday</div>
      <div class="hb-name">Paytyn</div>
    </div>
    <button id="cake" aria-label="Blow out the candles">
      <div class="candles"><div class="candle num"><i class="flame"></i><span>2</span></div><div class="candle num"><i class="flame"></i><span>1</span></div></div>
      <div class="tier top"></div>
      <div class="tier bottom"></div>
      <div class="plate"></div>
    </button>
    <p id="message"></p>
    <p id="credits"></p>
    <p id="signoff"><span>Yusuf</span></p>
  </div>

  <div class="ticker" id="ticker"><div class="ticker-track"></div></div>

  <button id="skip" aria-label="Skip to the end">skip ⏭</button>
  <div class="end-btns">
    <button id="replay" aria-label="Replay">↻</button>
    <button id="wallBtn" aria-label="All the pics">📸</button>
  </div>
  <button id="soundPill">🔊 tap for music</button>
</main>

<!-- ============ INTRO ============ -->
<section id="intro">
  <div class="intro-ui">
    <div class="intro-bottom">
      <button id="startBtn" class="chip" aria-label="Start the show"><span class="chip-face">21</span></button>
      <p class="tap" id="tapText">tap the chip to start</p>
    </div>
    <p class="volume"><span class="spk">🔊<i></i><i></i></span> Turn your volume up</p>
  </div>
</section>

<!-- ============ PHOTO WALL ============ -->
<div id="wall" hidden>
  <button class="close" id="wallClose" aria-label="Close">✕</button>
  <h2>The Paytyn Archives</h2>
  <div class="grid" id="wallGrid"></div>
</div>
<div id="lightbox" hidden><img alt=""><p></p></div>

<!-- mockingjay pin, used in a couple of places -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mockingjay" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="6"/>
    <path fill="currentColor" d="M14 44 C26 38 38 42 47 52 L50 46 L53 52 C62 42 74 38 86 44 C76 46 67 52 61 60 L68 76 L56 68 L50 80 L44 68 L32 76 L39 60 C33 52 24 46 14 44 Z"/>
    <path stroke="currentColor" stroke-width="3" d="M30 44 L72 44"/>
  </symbol>
</svg>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/confetti.browser.js"></script>
<script src="scene.js"></script>
<script src="app.js"></script>
</body>
</html>
